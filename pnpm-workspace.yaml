packages:
  - packages/*

# Native-binary deps whose install scripts we explicitly trust (pnpm 10+ blocks them by default).
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  '@libsql/client': true
  libsql: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - deslop-js@0.9.6
  - oxlint-plugin-react-doctor@0.9.6
  - react-doctor@0.9.6
