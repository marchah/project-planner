# Publishes the container image to GHCR for commits that land on main (and v* tags), then moves the
# `deploy` branch to the commit it just published. ci.yml only checks that the Dockerfile builds.
#
# Deployments track `deploy`, not `main`: the publish takes about 2 minutes and a git-polling
# deployer can see a new `main` commit before its image exists, redeploy the previous image, and
# never retry. `deploy` only ever points at a commit whose image is already in the registry.
name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to move the deploy branch
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `main` follows the default branch; `sha-<short>` is the immutable tag to pin for a rollback.
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Move the deploy branch to this commit
        if: github.ref == 'refs/heads/main'
        run: git push --force origin "HEAD:refs/heads/deploy"
