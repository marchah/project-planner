type ConflictError {
  message: String!
  status: Int!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

type Decision {
  appliedAt: DateTime
  createdAt: DateTime!
  id: ID!
  source: DecisionSource!
  text: String!
}

enum DecisionSource {
  ASSISTANT
  BOARD
}

type Idea {
  body: String!
  createdAt: DateTime!

  """What the author decided outside the questions, oldest first."""
  decisions: [Decision!]!
  id: ID!
  latestPlan: Plan
  openQuestionCount: Int!
  questions: [Question!]!

  """The most recent research job for this idea."""
  research: ResearchJob
  source: IdeaSource!
  sourceUrl: String
  status: IdeaStatus!
  title: String
  updatedAt: DateTime!
}

enum IdeaSource {
  API
  SLACK
  WEB
}

enum IdeaStatus {
  BUILDING
  CAPTURED
  DONE
  PLANNED
  RESEARCHING
  SHELVED
}

type Mutation {
  answerQuestion(answer: String!, id: ID!): MutationAnswerQuestionResult!
  captureIdea(text: String!, title: String): MutationCaptureIdeaResult!
  deleteIdea(id: ID!): MutationDeleteIdeaResult!
  generateIdeaTitle(id: ID!): MutationGenerateIdeaTitleResult!
  recordDecision(ideaId: ID!, text: String!): MutationRecordDecisionResult!
  startResearch(ideaId: ID!): MutationStartResearchResult!
  updateIdea(body: String, id: ID!, status: IdeaStatus, title: String): MutationUpdateIdeaResult!
}

union MutationAnswerQuestionResult = ConflictError | MutationAnswerQuestionSuccess | NotFoundError | ServerError | ValidationError

type MutationAnswerQuestionSuccess {
  data: Idea!
}

union MutationCaptureIdeaResult = MutationCaptureIdeaSuccess | ServerError | ValidationError

type MutationCaptureIdeaSuccess {
  data: Idea!
}

union MutationDeleteIdeaResult = MutationDeleteIdeaSuccess | NotFoundError | ServerError

type MutationDeleteIdeaSuccess {
  data: Idea!
}

union MutationGenerateIdeaTitleResult = MutationGenerateIdeaTitleSuccess | NotFoundError | ServerError | ServiceUnavailableError

type MutationGenerateIdeaTitleSuccess {
  data: Idea!
}

union MutationRecordDecisionResult = MutationRecordDecisionSuccess | NotFoundError | ServerError | ValidationError

type MutationRecordDecisionSuccess {
  data: Idea!
}

union MutationStartResearchResult = MutationStartResearchSuccess | NotFoundError | ServerError | ServiceUnavailableError

type MutationStartResearchSuccess {
  data: Idea!
}

union MutationUpdateIdeaResult = MutationUpdateIdeaSuccess | NotFoundError | ServerError | ValidationError

type MutationUpdateIdeaSuccess {
  data: Idea!
}

type NotFoundError {
  message: String!
  status: Int!
}

type Plan {
  createdAt: DateTime!
  id: ID!
  planMd: String!
  researchMd: String!
  shelveReason: String
  sources: [PlanSource!]!
  stack: [StackItem!]!
  suggestion: PlanSuggestion!
  summary: String!
  version: Int!
}

type PlanSource {
  firstParty: Boolean!
  title: String!
  url: String!
}

enum PlanSuggestion {
  PLANNED
  SHELVED
}

type Query {
  idea(id: ID!): QueryIdeaResult!
  ideas: [Idea!]!
  researchEnabled: Boolean!
}

union QueryIdeaResult = NotFoundError | QueryIdeaSuccess | ServerError

type QueryIdeaSuccess {
  data: Idea!
}

type Question {
  answer: String
  answeredAt: DateTime

  """What applying the answer changed in the plan."""
  appliedNote: String
  createdAt: DateTime!
  defaultAnswer: String!
  id: ID!
  number: Int!
  resolvedAt: DateTime
  status: QuestionStatus!
  text: String!
  topic: String!
  why: String!
}

enum QuestionStatus {
  ANSWERED
  OPEN
  RESOLVED
  SUPERSEDED
}

type ResearchJob {
  attempt: Int!
  createdAt: DateTime!
  error: String
  finishedAt: DateTime
  id: ID!
  kind: ResearchJobKind!
  notBefore: DateTime!

  """What the finished job did, e.g. what a refresh changed."""
  outcome: String
  startedAt: DateTime
  status: ResearchJobStatus!
}

enum ResearchJobKind {
  INTAKE
  REFRESH
}

enum ResearchJobStatus {
  FAILED
  QUEUED
  RUNNING
  SUCCEEDED
}

type ServerError {
  message: String!
  status: Int!
}

type ServiceUnavailableError {
  message: String!
  status: Int!
}

type StackItem {
  name: String!
  role: String!
  version: String
}

type ValidationError {
  message: String!
  status: Int!
}
