# Project Planner — sticky-note board for project ideas (SPA + GraphQL + REST, one container).
#
# Deployed as a Portainer GIT STACK from this repo:
#   Portainer -> Stacks -> Add stack -> Repository
#     Repository URL:  https://github.com/marchah/project-planner
#     Reference:       refs/heads/main
#     Compose path:    deploy/compose.yaml
#
# Public repo + public GHCR package: no git or registry credentials needed. Nothing secret lives
# here; step-2 Hermes settings arrive as Portainer stack env vars and default to empty.
#
# `pull_policy: always` makes a redeploy fetch the moving `main` tag instead of reusing a stale
# local image. To roll back, pin an immutable tag: ghcr.io/marchah/project-planner:sha-<short>

services:
  project-planner:
    image: ghcr.io/marchah/project-planner:main
    pull_policy: always
    container_name: project-planner
    restart: unless-stopped
    # Docker's embedded resolver forwards to the VM's systemd-resolved stub, which refuses
    # single-label names — so `hermes` would never resolve without this.
    dns:
      - 192.168.1.1
    ports:
      - '${PROJECT_PLANNER_PORT:-4200}:4000'
    volumes:
      # The ONLY precious state: ideas, and later plans and your answers. Back this volume up.
      - project-planner-data:/data
    environment:
      DATABASE_URL: file:/data/app.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Base of the links in REST responses, i.e. the link Hermes posts back to Slack. Empty = the
      # Host header the caller used. Hermes calls `docker-host`, which not every browser on the LAN
      # resolves, so set this to the address you actually open the board with.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Names each new idea (~0.5 s). Any OpenAI-compatible endpoint; CT 120's llama.cpp by default.
      # Unreachable or empty: ideas are saved untitled and can be titled from the board later.
      TITLE_MODEL_BASE_URL: ${TITLE_MODEL_BASE_URL-http://llamacpp.lan:1234/v1}
      TITLE_MODEL: ${TITLE_MODEL:-qwen3.6-35b-a3b}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  project-planner-data:
