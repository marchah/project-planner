# Project Planner — sticky-note board for project ideas (SPA + GraphQL + REST, one container).
#
# Deployed as a Portainer GIT STACK from this repo:
#   Portainer -> Stacks -> Add stack -> Repository
#     Repository URL:  https://github.com/marchah/project-planner
#     Reference:       refs/heads/main
#     Compose path:    deploy/compose.yaml
#
# Public repo + public GHCR package: no git or registry credentials needed. Nothing secret or
# environment-specific lives here: set the env vars below on the Portainer stack.
#
# `pull_policy: always` makes a redeploy fetch the moving `main` tag instead of reusing a stale
# local image. To roll back, pin an immutable tag: ghcr.io/marchah/project-planner:sha-<short>

services:
  project-planner:
    image: ghcr.io/marchah/project-planner:main
    pull_policy: always
    container_name: project-planner
    restart: unless-stopped
    ports:
      - '${PROJECT_PLANNER_PORT:-4200}:4000'
    volumes:
      # The ONLY precious state: ideas, and later plans and your answers. Back this volume up.
      - project-planner-data:/data
    environment:
      DATABASE_URL: file:/data/app.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Everything environment-specific comes from the stack's env vars; nothing is defaulted here.
      # Use full hostnames (host.lan, an IP): Docker's resolver may not resolve single-label names.
      #
      # Base of the links the REST API returns. Empty: the Host header the caller used.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # OpenAI-compatible endpoint (…/v1) that titles new ideas. Empty: ideas are saved untitled.
      TITLE_MODEL_BASE_URL: ${TITLE_MODEL_BASE_URL:-}
      # Only for servers that need them (hosted APIs); llama.cpp ignores the model name.
      TITLE_MODEL: ${TITLE_MODEL:-}
      TITLE_MODEL_API_KEY: ${TITLE_MODEL_API_KEY:-}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  project-planner-data:
